name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test Sweeply.sln -c Release

      - name: Publish
        run: dotnet publish src/Sweeply/Sweeply.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: Sweeply
          path: publish/Sweeply.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/Sweeply.exe
